# Builds and tests Duck Quill on Windows and Linux for every push and pull
# request, and runs clippy (Rust's checker for common mistakes). A red
# cross on GitHub means one of these steps failed: click it to see which.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch replaces a run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same Rust as the one the project is developed with, so a new Rust
  # release can't suddenly turn the build red.
  RUST_VERSION: "1.97.0"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
      # Keeps the compiled libraries between runs: minutes faster.
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The real Duck Quill 0.5.0, tried on pictures this version saves: it
  # must open a picture with no frames with the same pixels, and refuse
  # an animated one with "saved by a newer version" (never open part of
  # it). See .github/compat/old-reader.sh.
  old-reader:
    name: Duck Quill 0.5.0 reads our pictures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # for the v0.5.0 tag
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Build quill 0.5.0
        run: |
          git worktree add ../v0.5.0 v0.5.0
          cargo build --release -p quill_cli --manifest-path ../v0.5.0/Cargo.toml
      - name: Try it on this version's pictures
        run: .github/compat/old-reader.sh ../v0.5.0/target/release/quill
